[project]
name = "bajaj-main"
version = "0.1.0"
description = "Bajaj AMC Fund Factsheet RAG Chatbot using LangChain, LangGraph, FAISS & Groq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core Framework - LangChain & LangGraph
    "langchain>=0.1.0,<0.3.0",
    "langchain-community>=0.0.13,<0.3.0",
    "langchain-groq>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langgraph>=0.0.20,<0.1.0",
    # LLM - Groq API
    "groq>=0.4.0",
    "langchain-openai>=0.0.5",
    "openai>=1.0.0",
    # Vector Store - FAISS (CPU version, no CUDA)
    "faiss-cpu>=1.7.4",
    # PDF Processing - Multimodal extraction
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "pypdf>=3.17.0",
    "pillow>=10.0.0",
    # UI - Streamlit and FastAPI
    "streamlit>=1.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.24.0,<2.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
